apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wyoming-whisper
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/wyoming-whisper
  prune: true
  sourceRef:
    kind: GitRepository
    name: my-apps
  dependsOn:
    - name: sealed-secrets
    - name: metallb-config
    - name: nfs-provisioner
